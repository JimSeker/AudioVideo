[versions]
agp = "9.5.2"
camera = "1.7.0"
concurrent = "1.3.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
imageLabeling = "17.0.9"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
image-labeling = { module = "com.google.mlkit:image-labeling", version.ref = "imageLabeling" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camera" }
camera-mlkit-vision = { module = "androidx.camera:camera-mlkit-vision", version.ref = "camera" }
concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrent" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

